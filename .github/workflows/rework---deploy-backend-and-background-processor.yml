name: Rework --- Build and Deploy Inventory Shopify

on:
  push:
    branches: [ feature/client-grant ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository_owner }}/inventory-shopify-backend---rework
  PROCESSOR_IMAGE: ${{ github.repository_owner }}/inventory-shopify-processor---rework

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./nextjs-app
          file: ./nextjs-app/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:rework
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-processor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Processor Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./background-processor
          file: ./background-processor/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PROCESSOR_IMAGE }}:rework
          cache-from: type=gha,scope=processor
          cache-to: type=gha,mode=max,scope=processor

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-processor]
    if: github.ref == 'refs/heads/feature/client-grant'

    steps:
      - name: Trigger deployment
        run: |
          curl -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository_owner }}/devops/dispatches \
            -d '{
              "event_type": "inventory-shopify-deploy---rework",
              "client_payload": {
                "backend_image": "${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:rework",
                "processor_image": "${{ env.REGISTRY }}/${{ env.PROCESSOR_IMAGE }}:rework"
              }
            }'