# Shopify app configuration - source of truth, deployed with `shopify app deploy`.
# App lives in the 8Examples Inc. organization (publishable); the earlier app in
# the Dev Disc Golf org could not be distributed publicly.

client_id = "7d64b85443b93189f1911020e5163b01"
name = "Disc Golf Inventory"
application_url = "https://shopify.fusenv.com/embedded"
embedded = true

[access_scopes]
scopes = "read_files,write_files,write_inventory,read_inventory,read_locations,read_products,write_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://shopify.fusenv.com/api/auth/shopify/token-exchange"
]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "https://shopify.fusenv.com/api/webhooks/shopify"
