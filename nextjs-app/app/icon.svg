<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- flight path swoosh -->
  <path d="M60 356 C 140 330, 200 322, 280 330" fill="none" stroke="#93c5fd" stroke-width="14" stroke-linecap="round" opacity="0.7"/>
  <path d="M84 396 C 160 372, 226 364, 318 374" fill="none" stroke="#93c5fd" stroke-width="14" stroke-linecap="round" opacity="0.45"/>

  <!-- disc, slightly banked -->
  <g transform="rotate(-12 276 232)">
    <!-- rim shadow / underside -->
    <ellipse cx="276" cy="244" rx="180" ry="86" fill="#1e3a8a" opacity="0.55"/>
    <!-- top plate -->
    <ellipse cx="276" cy="228" rx="180" ry="86" fill="url(#disc)"/>
    <!-- inner ring -->
    <ellipse cx="276" cy="228" rx="122" ry="56" fill="none" stroke="#60a5fa" stroke-width="10"/>
    <!-- center button -->
    <ellipse cx="276" cy="228" rx="20" ry="9" fill="#3b82f6"/>
  </g>
</svg>
